<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth's Tipping Points</title>
<meta name="description" content="Rotating globe of 16 climate tipping points (Armstrong McKay et al. 2022, updated with the 2024 review and 2025 report), in English and Thai.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap">
<style>
/* Layout: a dark, quiet stage for one luminous dot-globe; a slim glass list on the right. Single deliberate dark look. */
:root {
  color-scheme: dark;
  --bg: #08081a;
  --bg2: #12123a;
  --glass: rgba(255,255,255,0.045);
  --line: rgba(255,255,255,0.09);
  --ink: #f4f3ff;
  --muted: #9a98c2;
  --ice: #5ee7ff;
  --life: #a6ff6b;
  --ocean: #ff8a4c;
  --warn: #ff4f7b;
  --font: "Prompt", "Noto Sans Thai", "Leelawadee UI", "Segoe UI", Helvetica, Arial, sans-serif;
}
html, body { height: 100%; }
body { background: radial-gradient(120% 90% at 30% 40%, var(--bg2) 0%, var(--bg) 60%) fixed, var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; font-weight: 300; }
.app {
  display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); grid-template-rows: minmax(0, 1fr);
  gap: 20px; height: 100%; box-sizing: border-box; padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; }
h1 { font-weight: 600; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--warn); }
.sub { margin: 6px 0 0; color: var(--muted); max-width: 52ch; line-height: 1.5; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--glass); }
.lang button { font: 500 13px var(--font); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.globe-wrap { position: relative; flex: 1; min-height: 380px; }
canvas#globe { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
canvas#globe:active { cursor: grabbing; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: 400 12.5px var(--font); color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ice); color: var(--ice); }
.chip:focus-visible, .row:focus-visible, .lang button:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12.5px; margin-left: auto; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.orb { width: 11px; height: 11px; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px currentColor; }
.tip { position: absolute; pointer-events: none; background: rgba(12,12,36,0.9); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 12.5px; max-width: 250px; line-height: 1.45; backdrop-filter: blur(6px); }
.tip strong { font-weight: 600; font-size: 14px; display: block; }
.tip .t { color: var(--muted); }
aside { min-width: 0; max-height: 100%; background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; backdrop-filter: blur(8px); }
.ahead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
aside h2 { font-weight: 500; font-size: 15px; margin: 0; }
.badge { display: inline-block; margin-top: 10px; line-height: 1.5; font-size: 12px; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.badge b { font-weight: 500; color: var(--ice); }
.upd { display: inline-block; margin-top: 4px; font-size: 11px; color: var(--warn); border: 1px solid rgba(255,79,123,0.45); border-radius: 999px; padding: 1px 8px; }
body.video .badge { display: none; }
.upd.ews { color: var(--ocean); border-color: rgba(255,138,76,0.5); }
.upd.less { color: var(--muted); border-color: var(--line); }
.fact { color: var(--ink); font-size: 12px; margin-top: 3px; }
.news { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; line-height: 1.45; color: var(--muted); background: rgba(255,79,123,0.06); border: 1px solid rgba(255,79,123,0.25); border-radius: 14px; padding: 10px 12px; }
.news h3 { margin: 0 0 2px; font-weight: 500; font-size: 13px; color: var(--warn); }
.news b { color: var(--ink); font-weight: 500; }
.now-pill { font-size: 12px; color: var(--warn); border: 1px solid rgba(255,79,123,0.4); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; padding-right: 4px; }
.group { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
.row { display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; cursor: pointer; }
.row:hover, .row.on { background: rgba(255,255,255,0.06); }
.row .orb { width: 10px; height: 10px; }
.row .n { font-weight: 500; font-size: 13.5px; line-height: 1.3; }
.row .w { color: var(--muted); font-size: 12px; line-height: 1.35; }
.bar { position: relative; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); margin-top: 6px; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; opacity: 0.6; }
.bar b { position: absolute; top: -3px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; }
.bar s { position: absolute; top: -5px; bottom: -5px; width: 0; border-left: 1.5px solid var(--warn); }
.deg { font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.07); border-radius: 999px; padding: 3px 9px; }
.note { color: var(--muted); font-size: 11.5px; line-height: 1.55; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 10px; }
.note a { color: var(--ice); }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; height: auto; grid-template-rows: auto; }
  aside { max-height: none; }
  .globe-wrap { flex: none; height: 96vw; max-height: 600px; min-height: 340px; }
  .legend { margin-left: 0; }
}
/* video mode: globe only, for recording */
body.video { background: radial-gradient(110% 90% at 50% 50%, var(--bg2) 0%, var(--bg) 62%), var(--bg); }
body.video .app { grid-template-columns: 1fr; padding: 0; }
body.video aside, body.video .controls .chip, body.video .lang, body.video .sub { display: none; }
body.video .top { position: absolute; top: 44px; left: 60px; z-index: 2; }
body.video h1 { font-size: 58px; }
body.video .vsub { display: block; }
body.video .controls { position: absolute; left: 60px; bottom: 48px; z-index: 2; }
body.video .legend { flex-direction: column; gap: 12px; font-size: 20px; color: var(--ink); }
body.video .legend .orb { width: 16px; height: 16px; }
body.video .globe-wrap { height: 100vh; }
.vsub, .vsrc { display: none; }
.vsub { color: var(--muted); font-size: 22px; margin-top: 10px; }
body.video .vsrc { display: block; position: absolute; right: 60px; bottom: 48px; z-index: 2; color: var(--muted); font-size: 16px; text-align: right; line-height: 1.55; }
</style>
<style>html,body{margin:0}*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div class="top">
      <div>
        <h1 id="title"></h1>
        <p class="sub" id="sub"></p>
        <div class="badge" id="badge"></div>
        <div class="vsub" id="vsub"></div>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button id="l-en" aria-pressed="true">EN</button>
        <button id="l-th" aria-pressed="false">ไทย</button>
      </div>
    </div>
    <div class="globe-wrap" id="wrap">
      <canvas id="globe" aria-label="Rotating globe showing climate tipping points"></canvas>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="controls">
      <button class="chip" id="spin" aria-pressed="true"></button>
      <button class="chip" id="labels" aria-pressed="true"></button>
      <button class="chip" id="view-n"></button>
      <button class="chip" id="view-s"></button>
      <div class="legend" id="legend"></div>
    </div>
  </section>
  <div class="vsrc" id="vsrc"></div>
  <aside>
    <div class="ahead"><h2 id="list-h"></h2><span class="now-pill" id="now-pill"></span></div>
    <div class="list" id="list"></div>
  </aside>
</div>
